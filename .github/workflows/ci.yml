name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  quality:
    name: Ruff and pytest
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Run ruff
        run: uv run -- ruff check src tests tools/build_windows_portable.py

      - name: Validate release smoke tooling
        run: |
          uv run -- ruff check --select I tools/release_smoke
          uv run python -m py_compile `
            tools/release_smoke/windows_package_smoke.py `
            tools/release_smoke/download_external_assets.py

      - name: Run pytest
        run: uv run pytest
